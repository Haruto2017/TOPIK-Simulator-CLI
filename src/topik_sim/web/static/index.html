<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPIK Simulator</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%232a78d6'/%3E%3Ctext%20x='32'%20y='44'%20font-size='32'%20text-anchor='middle'%20fill='white'%20font-family='serif'%3E%ED%95%9C%3C/text%3E%3C/svg%3E">

<body>
<div id="shell">

  <main id="view" aria-live="polite"></main>

<div id="toast" hidden></div>
<script src="/app.js"></script>
